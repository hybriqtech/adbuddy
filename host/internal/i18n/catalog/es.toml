"help.stop.short" = "Para el agente que ejecuta adbuddy serve (serve sigue en marcha)"

# connect.go: cobra
"help.connect.short" = "Conecta con el móvil por dirección IP y puerto (Tailscale u otra red sin mDNS)"
"help.connect.long" = """
Conecta con el móvil por la dirección IP y el puerto que enseña su pantalla de
Depuración inalámbrica, cuando ADBuddy no lo encuentra por sí solo: con Tailscale, o en una
red que bloquea mDNS. El móvil debe estar emparejado antes con este PC (`adbuddy setup --code`).
La dirección se comprueba con el móvil que configuraste y se guarda en config.toml, así
`adbuddy serve` la usa de nuevo. El puerto cambia cada vez que se activa la depuración
inalámbrica: vuelve a ejecutar este comando con el nuevo."""

# connect.go: flag
"help.connect.flag.adb" = "ruta del adb real (por defecto: adb_path de config.toml, y si no, el adb que instala adbuddy setup)"

# doctor.go: cobra
"help.doctor.short" = "Comprueba que ADBuddy, adb, el móvil y la app están listos, y explica cómo arreglar lo que no lo esté"
"help.doctor.long" = """
Comprueba, por orden, todo lo que ADBuddy necesita: la configuración, el adb de ADBuddy y su
servidor privado, `adbuddy serve`, el móvil (conectado, el que configuraste, sin puerto de
red abierto), la app del móvil y el entorno del agente. Cada problema trae una línea
«Ejecuta:» (un comando seguro) o una línea «Qué hacer:» (algo que solo puedes hacer tú);
en la sesión del agente, lo que solo puedes ejecutar tú pasa a ser «Ejecuta tú …».
Solo lee: no cambia nada en el móvil. Con --fix también reinicia el servidor privado de adb
de ADBuddy cuando es lo que falla y serve no está en marcha.
Doctor responde en menos de 60 segundos.
Código de salida: 0 listo o degradado, 1 roto, 130 detenido con Ctrl+C."""

# doctor.go: flag
"help.doctor.flag.fix" = "reinicia también el servidor privado de adb de ADBuddy cuando es lo que falla (nunca mientras serve esté en marcha)"

