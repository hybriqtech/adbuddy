# attach.go: cobra
"help.attach.short" = "Conecta esta terminal a la sesión del agente en adbuddy serve (Ctrl+] para desconectar)"
"help.attach.long" = """
Conecta esta terminal al agente que ejecuta adbuddy serve. Ves su pantalla y
escribes en ella; Ctrl+] desconecta y deja el agente en marcha.
Mientras estás conectado, el tamaño de esta terminal es el del agente."""
