# setup.go: cobra
"help.setup.short" = "Configura ADBuddy: consigue adb, empareja el móvil por Wi-Fi y prepara el entorno del agente"
"help.setup.long" = """
Configura ADBuddy paso a paso: descarga las platform-tools de Android (comprobadas con la
suma de verificación de Google), empareja el móvil por depuración inalámbrica con un código QR (o
con --code), conecta, lee el perfil del móvil, elige el agente y crea el
entorno. Puedes ejecutarlo de nuevo en cualquier momento; se salta lo que ya está hecho.

Con Tailscale u otra red sin mDNS, empareja con --code y da la
dirección de conexión con --connect (o escríbela cuando te la pida)."""

