# remotecmd.go: cobra (generated by i18nize)
"help.remote.short" = "Open adb's network port 5555 for 12 hours (remote mode), close it, or see its state"
"help.remote.long" = """
Remote mode opens adb's port 5555 on every network for 12 hours, so the host can
reach the phone over Tailscale with only mobile data. `on` asks you first (in the
