# connect.go: cobra (generated by i18nize)
"help.connect.short" = "Connect to the phone by IP address and port (Tailscale or another network without mDNS)"
"help.connect.long" = """
Connect to the phone by the IP address and port shown on its Wireless debugging
screen, when ADBuddy cannot find it by itself: over Tailscale, or on a network
that blocks mDNS. The phone must be paired with this PC first (`adbuddy setup --code`).
The address is checked against the phone you set up and saved in config.toml, so
`adbuddy serve` uses it again. The port changes each time wireless debugging is
turned on: run this command again with the new one."""

# connect.go: flag (generated by i18nize)
"help.connect.flag.adb" = "path to the real adb (default: adb_path in config.toml, else the adb installed by adbuddy setup)"

# doctor.go: cobra (generated by i18nize)
"help.doctor.short" = "Check that ADBuddy, adb, the phone and the app are ready, and say how to fix what is not"
"help.doctor.long" = """
Check, in order, everything ADBuddy needs: configuration, ADBuddy's adb and its
private server, `adbuddy serve`, the phone (connected, the one you set up, no open
network port), the phone app and the agent environment. Every problem comes with
a "Run:" line (a safe command) or a "Guidance:" line (something only you can do);
in the agent's session, what only you can run becomes "Ask the user to run …".
It only reads: nothing on the phone changes. With --fix it also restarts
ADBuddy's private adb server when that is what fails and serve is not running.
Doctor answers within 60 seconds.
Exit code: 0 ready or degraded, 1 broken, 130 stopped with Ctrl+C."""

# doctor.go: flag (generated by i18nize)
"help.doctor.flag.fix" = "also restart ADBuddy's private adb server when it is what fails (never while serve runs)"

