name: emulator
# Trust rule: a pull request opened by anyone but the repository owner
# (Dependabot, other bots, collaborators) never reaches a self-hosted runner;
# it runs on GitHub-hosted runners whatever the CI_* variables say. See
# docs/ci-self-hosted.md section 6.
# Its job is skipped for such pull requests; the owner runs it by hand
# (workflow_dispatch) after reviewing the diff.
# Runners come from repository variables (docs/ci-self-hosted.md); with none
# set, GitHub-hosted runners are used.

# Tests that need a real Android: the classifier's oracle (what the phone's
# mksh does with each differential case) and the read-only examples of the
# skills (they must run on the phone's toybox) and the app's tests (its
# instrumented tests and the host against it, M2.5b: they run on an android-34
# image, after the oracle, in the same job because one emulator fits in RAM at
# a time). Only on pull requests and by
# hand (workflow_dispatch), and only when what it checks changes. It does not
# run on pushes to main: merges to main are fast-forwards of a pull request
# that already passed it, so main's tree is the one it validated.
on:
  pull_request:
    paths: ["host/internal/classify/**", "host/internal/workspace/skills/**", "host/internal/cli/skills_*_test.go", "host/internal/emutest/**", "host/internal/phoneapp/**", "host/internal/adb/**", "host/internal/bridge/**", "host/internal/shq/**", "host/internal/safeio/**", "host/internal/journal/**", "host/internal/confirm/**", "host/internal/i18n/**", "host/go.mod", "host/go.sum", "android/**", "scripts/emulator.sh", ".github/workflows/emulator.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run in progress: two runs would
# share the emulator port and RAM of the runner. Cancelling still runs the steps
# with if: always(), so the emulator is stopped.
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mksh:
    name: oracle against the emulator's mksh
    # Fork pull requests never reach a self-hosted runner.
    if: ${{ vars.CI_RUNNER_EMULATOR != '"none"' && (vars.CI_RUNNER_EMULATOR == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login == github.repository_owner) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_EMULATOR || '"ubuntu-latest"') }}
    timeout-minutes: 90
    # Its own AVD, emulator port and adb server, so it never collides with an
    # emulator started by hand with the script's defaults (just names).
    env:
      ADBUDDY_EMU_AVD: adbuddy-ci-api37
      ADBUDDY_EMU_PORT: "5590"
      ADBUDDY_EMU_ADB_PORT: "5049"
      # Its adb server never auto-connects a phone over mDNS.
      ADB_MDNS: "0"
      ADB_MDNS_AUTO_CONNECT: "0"
    defaults:
      run:
        shell: bash -e {0}
    # On the runner avdmanager writes the AVD under $XDG_CONFIG_HOME/.android
    # whatever ANDROID_AVD_HOME says, and the emulator looks under
    # ANDROID_AVD_HOME or $HOME/.android: the step "Point the emulator at the
    # AVD" makes the emulator look where avdmanager wrote it.
    # adb on Windows loads %USERPROFILE%\.android\adbkey whatever HOME/USERPROFILE/ANDROID_USER_HOME say (measured),
    # so isolating the environment does not protect the key; see docs/ci-self-hosted.md section 6.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: host/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: host/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.8.0"
          cache-disabled: ${{ runner.environment != 'github-hosted' }}
      - name: Point the emulator at the AVD (Linux runners)
        if: runner.os == 'Linux'
        run: '[ -z "$XDG_CONFIG_HOME" ] || echo "ANDROID_AVD_HOME=$XDG_CONFIG_HOME/.android/avd" >> "$GITHUB_ENV"'
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The image's SDK package is "android-37.0", as in android.yml.
      # On Windows sdkmanager is sdkmanager.bat.
      - name: Install the emulator and the system image
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -e "$sm" ] || sm="$sm.bat"
          yes | "$sm" emulator "system-images;android-37.0;google_apis;x86_64" > /dev/null
      # Built before any emulator starts, so they never share the RAM. No device
      # and no ANDROID_SERIAL here: no connected* task is ever run (Gradle's own
      # adb server is 5037, where a phone may be); the host installs the APKs
      # through the emulator's adb server (internal/emutest).
      # compileSdk = 37: its SDK package is "platforms;android-37.0", as in android.yml.
      # Kotlin in-process: no Kotlin daemon is left running on a self-hosted runner.
      - name: Build the app and its instrumented tests
        working-directory: android
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -e "$sm" ] || sm="$sm.bat"
          yes | "$sm" "platforms;android-37.0" > /dev/null
          gradle --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Clear a leftover emulator of this job
        run: scripts/emulator.sh stop
      - name: Start the emulator
        shell: bash # with pipefail: a failed start fails this step, not the next one
        run: scripts/emulator.sh start | sed "s/^export //; s/'//g" >> "$GITHUB_ENV"
      - name: Record the oracle
        working-directory: host
        # Without the variables the test would skip and the step would pass.
        run: test -n "$ADBUDDY_MKSH_SERIAL" && go test -timeout 60m -count=1 -run TestRecordOracle ./internal/classify
      - name: The recorded oracle is the one in the repository
        run: git diff --exit-code -- host/internal/classify/testdata
      - name: The skills' read-only examples run on the emulator
        working-directory: host
        # Without the variables the test would skip and the step would pass.
        run: test -n "$ADBUDDY_MKSH_SERIAL" && test -n "$ADBUDDY_MKSH_ADB" && go test -timeout 20m -count=1 -run TestSkillsReadOnlyOnEmulator ./internal/cli
      - name: Emulator memory after the oracle
        if: always()
        run: scripts/emulator.sh mem || true
      # The app's tests: android-34, because android-37 loops in surfaceflinger
      # with every GPU mode tried. One emulator at a time: the 37 is stopped
      # first. Same emulator port and adb server port as the job (the env of the
      # step overrides the job's), another AVD. Each start (the first one and
      # the restart between the two groups of tests) rewrites the ADBUDDY_*
      # variables of $GITHUB_ENV with the same serial and adb path.
      # TestCutAccessAndReactivate is not run here (it needs ADBUDDY_EMULATOR_CUT=1).
      - name: Stop the android-37 emulator
        run: scripts/emulator.sh stop
      - name: Install the android-34 system image
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -e "$sm" ] || sm="$sm.bat"
          yes | "$sm" "system-images;android-34;google_apis;x86_64" > /dev/null
      # The env of this step and of "Restart the android-34 emulator" must stay
      # identical (the restart is the same start).
      # ADBUDDY_EMU_RAM (plain MB) lowers the guest's RAM; see docs/ci-self-hosted.md.
      - name: Start the android-34 emulator
        id: start34
        shell: bash # with pipefail: a failed start fails this step, not the next one
        env:
          ADBUDDY_EMU_IMAGE: system-images;android-34;google_apis;x86_64
          ADBUDDY_EMU_AVD: adbuddy-ci-api34
          ADBUDDY_EMU_PORT: "5590"
          ADBUDDY_EMU_ADB_PORT: "5049"
          ADBUDDY_EMU_STABLE_SECS: "120"
          ADBUDDY_EMULATOR_CUT: ""
        run: scripts/emulator.sh start | sed "s/^export //; s/'//g" >> "$GITHUB_ENV"
      # qemu's memory only grows while the emulator runs (about 3-4 GB per 10 min of
      # these tests, never returned), so the screen-driven guard tests run first
      # on a fresh emulator and the rest on another fresh one.
      - name: The host against the app on the emulator (guard tests)
        working-directory: host
        # Without the variables the tests would skip and the step would pass.
        env:
          ADBUDDY_EMULATOR_CUT: ""
        run: |
          test -n "$ADBUDDY_EMULATOR_SERIAL"
          test -n "$ADBUDDY_EMULATOR_ADB"
          # A split that finds nothing is stale (a renamed test): fail, do not pass silently.
          out=$(go test -list '^TestTheGuard' ./internal/emutest) || exit 1
          grep -q '^TestTheGuard' <<<"$out" || { echo "no guard tests: the split of emutest is stale" >&2; exit 1; }
          go test -timeout 20m -count=1 -v -run '^TestTheGuard' ./internal/emutest
      - name: Emulator memory after the guard tests
        if: always()
        run: scripts/emulator.sh mem || true
      # If the guard group fails the rest still runs (half the signal is better
      # than none), but not when the first start failed.
      - name: Restart the android-34 emulator
        id: restart34
        if: (success() || failure()) && steps.start34.outcome == 'success'
        shell: bash # with pipefail, like the first start
        # Identical to the env of "Start the android-34 emulator".
        env:
          ADBUDDY_EMU_IMAGE: system-images;android-34;google_apis;x86_64
          ADBUDDY_EMU_AVD: adbuddy-ci-api34
          ADBUDDY_EMU_PORT: "5590"
          ADBUDDY_EMU_ADB_PORT: "5049"
          ADBUDDY_EMU_STABLE_SECS: "120"
          ADBUDDY_EMULATOR_CUT: ""
        run: |
          scripts/emulator.sh stop
          scripts/emulator.sh start | sed "s/^export //; s/'//g" >> "$GITHUB_ENV"
      - name: The host against the app on the emulator (the rest)
        if: (success() || failure()) && steps.restart34.outcome == 'success'
        working-directory: host
        # Without the variables the tests would skip and the step would pass.
        env:
          ADBUDDY_EMULATOR_CUT: ""
        run: test -n "$ADBUDDY_EMULATOR_SERIAL" && test -n "$ADBUDDY_EMULATOR_ADB" && go test -timeout 40m -count=1 -v -skip '^TestTheGuard' ./internal/emutest
      - name: Emulator memory after the rest
        if: always()
        run: scripts/emulator.sh mem || true
      # Evidence for a failed start or recording: why the emulator did not
      # boot. The emulator has its own adb server (scripts/emulator.sh).
      - name: Emulator diagnostics
        if: failure() && runner.os == 'Linux'
        env:
          ANDROID_ADB_SERVER_PORT: ${{ env.ADBUDDY_EMU_ADB_PORT }}
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          tail -n 200 /tmp/adbuddy-emulator.log || true
          env | grep -E "^(ANDROID|XDG|HOME)" | sort || true
          find / -name "$ADBUDDY_EMU_AVD*" -not -path "/proc/*" 2>/dev/null | head || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd || true
          "$ANDROID_HOME/emulator/emulator" -list-avds || true
          "$ADB" devices -l || true
          timeout 20 "$ADB" -s "emulator-$ADBUDDY_EMU_PORT" shell getprop | grep -E "boot|init.svc.(surfaceflinger|zygote|system_server)" || true
          timeout 30 "$ADB" -s "emulator-$ADBUDDY_EMU_PORT" logcat -d -b crash,system | tail -n 150 || true
      # The same on Windows, with the job's own adb server (never 5037). The log
      # is the last emulator started (android-37 or android-34); the AVD of this
      # step's env is always the job's, so the running one is asked for.
      - name: Emulator diagnostics (Windows)
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          ANDROID_ADB_SERVER_PORT: ${{ env.ADBUDDY_EMU_ADB_PORT }}
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb.exe"
          tail -n 200 "${TMPDIR:-/tmp}/adbuddy-emulator.log" || true
          echo "job AVD: $ADBUDDY_EMU_AVD; running AVD:"
          timeout 20 "$ADB" -s "emulator-$ADBUDDY_EMU_PORT" emu avd name || true
          "$ADB" devices -l || true
      - name: Stop the emulator
        if: always()
        run: scripts/emulator.sh stop
