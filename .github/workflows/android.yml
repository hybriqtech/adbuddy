name: android

# Like host.yml: only on pull requests and pushes to main, never on every
# branch push. Linux only (macOS minutes count 10 times).
on:
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      # compileSdk = 37 (android/app/build.gradle.kts); its SDK package is "platforms;android-37.0".
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: "Unit tests, debug build, lint, and the instrumented tests compile (they run on an emulator by hand: see android/README.md)"
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
