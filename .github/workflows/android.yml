name: android
# Trust rule: a pull request opened by anyone but the repository owner
# (Dependabot, other bots, collaborators) never reaches a self-hosted runner;
# it runs on GitHub-hosted runners whatever the CI_* variables say. See
# docs/ci-self-hosted.md section 6.
# Runners come from repository variables (docs/ci-self-hosted.md); with none
# set, GitHub-hosted runners are used.

# Like host.yml: only on pull requests and pushes to main, never on every
# branch push. One runner (Linux by default; Windows self-hosted works too).
on:
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes (one group per
# workflow and ref). A push to main gets a group of its own (the run id) and
# never cancels, nor is cancelled by, anything: main and tags are never cut.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # Fork pull requests never reach a self-hosted runner.
    if: ${{ vars.CI_RUNNER_ANDROID != '"none"' && (vars.CI_RUNNER_ANDROID == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.user.login == github.repository_owner) && vars.CI_RUNNER_ANDROID || '"ubuntu-latest"') }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -e {0}
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
          cache-disabled: ${{ runner.environment != 'github-hosted' }}
      # compileSdk = 37 (android/app/build.gradle.kts); its SDK package is "platforms;android-37.0".
      # On Windows sdkmanager is sdkmanager.bat.
      - name: Install Android SDK platform 37
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -e "$sm" ] || sm="$sm.bat"
          yes | "$sm" "platforms;android-37.0"
      - name: "Unit tests, debug build, lint, and the instrumented tests compile (emulator.yml runs them)"
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      # The screen tests' golden images that came out different (android/README.md, "Screen tests"): verify fails on
      # Windows, compare only reports elsewhere, so it is said in the run's summary too. The folder exists only when
      # something changed.
      - name: Warn about screen differences
        if: ${{ !cancelled() }}
        run: |
          if [ -d app/build/outputs/roborazzi ]; then
            echo "::warning title=Screen differences::golden images differ: see the screen-differences artifact"
          fi
      - name: Screen differences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-differences
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
