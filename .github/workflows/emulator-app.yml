name: emulator-app
# Runs on a GitHub-hosted runner (docs/ci-self-hosted.md). Its job is skipped for
# a pull request opened by anyone but the repository owner (Dependabot, other
# bots, collaborators): the owner runs it by hand (workflow_dispatch) after
# reviewing the diff.

# The app's tests: its instrumented tests and the host against it (M2.5b), on
# an android-34 image. The classifier's oracle has its own workflow
# (emulator-oracle.yml). Only on pull requests and by hand
# (workflow_dispatch), and only when what it checks changes: the paths are
# every package `emutest` depends on, and TestAppWorkflowPathsCoverDependencies
# (host/internal/emutest) fails if one is missing. It does not run on pushes to
# main: merges to main are fast-forwards of a pull request that already passed
# it, so main's tree is the one it validated.
# A required check that a path filter skips stays pending: neither this
# workflow nor emulator-oracle.yml may be made a required check.
on:
  pull_request:
    paths: ["host/internal/emutest/**", "host/internal/adb/**", "host/internal/bridge/**", "host/internal/classify/**", "host/internal/confirm/**", "host/internal/daemon/**", "host/internal/device/**", "host/internal/i18n/**", "host/internal/ipc/**", "host/internal/journal/**", "host/internal/pairing/**", "host/internal/pathguard/**", "host/internal/phoneapp/**", "host/internal/precheck/**", "host/internal/procinfo/**", "host/internal/remote/**", "host/internal/safeio/**", "host/internal/screenshot/**", "host/internal/shq/**", "host/internal/uidump/**", "host/go.mod", "host/go.sum", "android/**", "protocol/**", "scripts/emulator.sh", ".github/workflows/emulator-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run in progress: two runs would
# share the emulator port and RAM of the runner. Cancelling still runs the steps
# with if: always(), so the emulator is stopped.
concurrency:
  group: emulator-app-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: the app on the emulator
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Its own AVD, emulator port and adb server, so it never collides with an
    # emulator started by hand with the script's defaults (just names). The
    # ports differ from the oracle's (5590 and 5049) so the two workflows never
    # share a console or adb port. Each job has its own runner, so they may run
    # at the same time.
    # android-34, because android-37 loops in surfaceflinger with every GPU mode
    # tried. Each start (the first one and the restart between the two groups
    # of tests) rewrites the ADBUDDY_* variables of $GITHUB_ENV with the same
    # serial and adb path.
    # TestCutAccessAndReactivate is not run here (it needs ADBUDDY_EMULATOR_CUT=1).
    env:
      ADBUDDY_EMU_AVD: adbuddy-ci-api34
      ADBUDDY_EMU_IMAGE: system-images;android-34;google_apis;x86_64
      ADBUDDY_EMU_PORT: "5592"
      ADBUDDY_EMU_ADB_PORT: "5051"
      ADBUDDY_EMU_STABLE_SECS: "120"
      ADBUDDY_EMULATOR_CUT: ""
      # Its adb server never auto-connects a phone over mDNS.
      ADB_MDNS: "0"
      ADB_MDNS_AUTO_CONNECT: "0"
    defaults:
      run:
        shell: bash -e {0}
    # On the runner avdmanager writes the AVD under $XDG_CONFIG_HOME/.android
    # whatever ANDROID_AVD_HOME says, and the emulator looks under
    # ANDROID_AVD_HOME or $HOME/.android: the step "Point the emulator at the
    # AVD" makes the emulator look where avdmanager wrote it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
      # After setup-java and setup-gradle: on GitHub-hosted runners they put /usr/bin (an older go) first in PATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: host/go.mod
          cache: true
          cache-dependency-path: host/go.sum
      - name: Point the emulator at the AVD
        run: '[ -z "$XDG_CONFIG_HOME" ] || echo "ANDROID_AVD_HOME=$XDG_CONFIG_HOME/.android/avd" >> "$GITHUB_ENV"'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and the android-34 system image
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sm" emulator "system-images;android-34;google_apis;x86_64" > /dev/null
      # Built before any emulator starts, so they never share the RAM. No device
      # and no ANDROID_SERIAL here: no connected* task is ever run (Gradle's own
      # adb server is 5037, where a phone may be); the host installs the APKs
      # through the emulator's adb server (internal/emutest).
      # compileSdk = 37: its SDK package is "platforms;android-37.0", as in android.yml.
      # Kotlin in-process: no Kotlin daemon is left running after the build.
      - name: Build the app and its instrumented tests
        working-directory: android
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sm" "platforms;android-37.0" > /dev/null
          gradle --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Clear a leftover emulator of this job
        run: scripts/emulator.sh stop
      # The env of this step and of "Restart the android-34 emulator" is the
      # job's (the restart is the same start).
      # ADBUDDY_EMU_RAM (plain MB) lowers the guest's RAM; see scripts/emulator.sh.
      - name: Start the android-34 emulator
        id: start34
        shell: bash # with pipefail: a failed start fails this step, not the next one
        run: scripts/emulator.sh start | sed "s/^export //; s/'//g" >> "$GITHUB_ENV"
      # qemu's memory only grows while the emulator runs (about 3-4 GB per 10 min of
      # these tests, never returned), so the screen-driven guard tests run first
      # on a fresh emulator and the rest on another fresh one.
      - name: The host against the app on the emulator (guard tests)
        working-directory: host
        # Without the variables the tests would skip and the step would pass.
        run: |
          test -n "$ADBUDDY_EMULATOR_SERIAL"
          test -n "$ADBUDDY_EMULATOR_ADB"
          # A split that finds nothing is stale (a renamed test): fail, do not pass silently.
          out=$(go test -list '^TestTheGuard' ./internal/emutest) || exit 1
          grep -q '^TestTheGuard' <<<"$out" || { echo "no guard tests: the split of emutest is stale" >&2; exit 1; }
          go test -timeout 20m -count=1 -v -run '^TestTheGuard' ./internal/emutest
      - name: Emulator memory after the guard tests
        if: always()
        run: scripts/emulator.sh mem || true
      # If the guard group fails the rest still runs (half the signal is better
      # than none), but not when the first start failed.
      - name: Restart the android-34 emulator
        id: restart34
        if: (success() || failure()) && steps.start34.outcome == 'success'
        shell: bash # with pipefail, like the first start
        run: |
          scripts/emulator.sh stop
          scripts/emulator.sh start | sed "s/^export //; s/'//g" >> "$GITHUB_ENV"
      - name: The host against the app on the emulator (the rest)
        if: (success() || failure()) && steps.restart34.outcome == 'success'
        working-directory: host
        # Without the variables the tests would skip and the step would pass.
        run: test -n "$ADBUDDY_EMULATOR_SERIAL" && test -n "$ADBUDDY_EMULATOR_ADB" && go test -timeout 55m -count=1 -v -skip '^TestTheGuard' ./internal/emutest
      - name: Emulator memory after the rest
        if: always()
        run: scripts/emulator.sh mem || true
      # Evidence for a failed start: why the emulator did not boot. The
      # emulator has its own adb server (scripts/emulator.sh).
      - name: Emulator diagnostics
        if: failure()
        env:
          ANDROID_ADB_SERVER_PORT: ${{ env.ADBUDDY_EMU_ADB_PORT }}
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          tail -n 200 /tmp/adbuddy-emulator.log || true
          env | grep -E "^(ANDROID|XDG|HOME)" | sort || true
          find / -name "$ADBUDDY_EMU_AVD*" -not -path "/proc/*" 2>/dev/null | head || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd || true
          "$ANDROID_HOME/emulator/emulator" -list-avds || true
          "$ADB" devices -l || true
          timeout 20 "$ADB" -s "emulator-$ADBUDDY_EMU_PORT" shell getprop | grep -E "boot|init.svc.(surfaceflinger|zygote|system_server)" || true
          timeout 30 "$ADB" -s "emulator-$ADBUDDY_EMU_PORT" logcat -d -b crash,system | tail -n 150 || true
      - name: Stop the emulator
        if: always()
        run: scripts/emulator.sh stop
