name: host
# Trust rule: a pull request opened by anyone but the repository owner
# (Dependabot, other bots, collaborators) never reaches a self-hosted runner;
# it runs on GitHub-hosted runners whatever the CI_* variables say. See
# docs/ci-self-hosted.md section 6.
# Runners come from repository variables (docs/ci-self-hosted.md); with none
# set, GitHub-hosted runners are used.

on:
  pull_request:
    paths: ["host/**", "protocol/**", "README.md", "README.es.md", "docs/**", ".github/workflows/host.yml"]
  push:
    branches: [main]
    paths: ["host/**", "protocol/**", "README.md", "README.es.md", "docs/**", ".github/workflows/host.yml"]

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes (one group per
# workflow and ref). A push to main gets a group of its own (the run id) and
# never cancels, nor is cancelled by, anything: main and tags are never cut.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: go test (${{ matrix.name }})
    # With CI_HOST_MATRIX set, fork pull requests never reach a self-hosted runner.
    if: ${{ vars.CI_HOST_MATRIX == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(!(github.event_name != 'pull_request' || github.event.pull_request.user.login == github.repository_owner) && '[{"name":"ubuntu-latest","runner":"ubuntu-latest"}]' || vars.CI_HOST_MATRIX || '[{"name":"ubuntu-latest","runner":"ubuntu-latest"},{"name":"windows-latest","runner":"windows-latest"},{"name":"macos-latest","runner":"macos-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Cheap mitigation, not a barrier: the tests of a branch run as the PC's
      # Windows user; with its own home, ssh, gh, git and agent configuration
      # are not found by the usual paths. adb on Windows still loads the real
      # %USERPROFILE%\.android\adbkey (measured), and a malicious process can
      # read the real home by absolute path: the real barrier is a dedicated
      # Windows account (docs/ci-self-hosted.md section 6). Not needed on the
      # Linux runner (WSL2 cannot see Windows files).
      - name: Give the job its own home (self-hosted runners)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: bash
        working-directory: .
        run: |
          home="$RUNNER_TEMP/job-home"
          mkdir -p "$home/.android" "$home/AppData/Roaming" "$home/AppData/Local"
          win="$(cygpath -w "$home")"
          {
            echo "HOME=$win"
            echo "USERPROFILE=$win"
            echo "ANDROID_USER_HOME=$win\\.android"
            echo "APPDATA=$win\\AppData\\Roaming"
            echo "LOCALAPPDATA=$win\\AppData\\Local"
            echo "ADB_VENDOR_KEYS="
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: host/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: host/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...
