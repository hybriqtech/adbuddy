name: host
# Every job runs on GitHub-hosted runners (docs/ci-self-hosted.md). A pull request
# opened by anyone but the repository owner (Dependabot, other bots,
# collaborators) gets only the ubuntu-latest entry of the matrix.

# docs/superpowers/** (specs, plans, validation notes) is design material that no test reads
# (the Pages test excludes it); a change that touches only it runs no CI. host.yml is not a
# required check, so skipping is safe.
on:
  pull_request:
    paths: ["host/**", "protocol/**", "README.md", "README.es.md", "docs/**", "!docs/superpowers/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["host/**", "protocol/**", "README.md", "README.es.md", "docs/**", "!docs/superpowers/**", ".github/workflows/**"]

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes (one group per
# workflow and ref). A push to main gets a group of its own (the run id) and
# never cancels, nor is cancelled by, anything: main and tags are never cut.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: go test (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(!(github.event_name != 'pull_request' || github.event.pull_request.user.login == github.repository_owner) && '[{"name":"ubuntu-latest","runner":"ubuntu-latest"}]' || '[{"name":"ubuntu-latest","runner":"ubuntu-latest"},{"name":"windows-latest","runner":"windows-latest"},{"name":"macos-latest","runner":"macos-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: host/go.mod
          cache: true
          cache-dependency-path: host/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Linux runs the suite once, with -race (same packages, no other flag); a second pass without it
      # would only repeat the same tests. Windows and macOS keep the plain run (docs/hooks.md: -race is Linux only here).
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...
